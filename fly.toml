# Fly.io application manifest for the Granger backend.
#
# Docs: https://fly.io/docs/reference/configuration/
#
# Before the first `fly deploy` you must create the app once:
#
#   fly launch --no-copy-config --dockerfile backend/Dockerfile --name granger-backend
#   fly secrets set \
#     NODE_ENV=production \
#     DATABASE_URL=... \
#     JWT_ACCESS_SECRET=... \
#     JWT_REFRESH_SECRET=... \
#     FRONTEND_URL=https://granger.vercel.app \
#     BACKEND_URL=https://granger-backend.fly.dev \
#     RESEND_API_KEY=... \
#     RESEND_FROM_EMAIL=... \
#     CLOUDINARY_CLOUD_NAME=... \
#     CLOUDINARY_API_KEY=... \
#     CLOUDINARY_API_SECRET=... \
#     CLOUDINARY_UPLOAD_PRESET=granger_avatars \
#     GOOGLE_CLIENT_ID=... \
#     GOOGLE_CLIENT_SECRET=... \
#     GITHUB_OAUTH_CLIENT_ID=... \
#     GITHUB_OAUTH_CLIENT_SECRET=... \
#     SENTRY_DSN_BACKEND=... \
#     LOGTAIL_SOURCE_TOKEN=... \
#     LOGTAIL_INGESTING_HOST=... \
#     REDIS_URL=...
#
# This file only references the build context and the HTTP service. All
# secrets come from `fly secrets set` (CLI) or the FLY_API_TOKEN-driven
# GitHub Action in .github/workflows/deploy.yml.

app = "granger-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "get"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
