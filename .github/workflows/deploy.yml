name: Deploy to Render

# Deploys both backend and frontend to Render via Deploy Hooks.
# Render builds and runs the services on its own infrastructure; this
# workflow just pokes each service's deploy hook to trigger a fresh build.
#
# Render reads:
#   - backend:  ./backend/Dockerfile  (Language=Docker, Free instance)
#   - frontend: ./frontend            (static site via Vite build -> dist)
#
# Required GitHub secrets (configure in
# https://github.com/LucasRomero26/granger/settings/secrets/actions):
#   RENDER_BACKEND_DEPLOY_HOOK  -> https://api.render.com/deploy/... (from backend service settings)
#   RENDER_FRONTEND_DEPLOY_HOOK -> https://api.render.com/deploy/... (from frontend service settings)
#
# One-time setup:
#   1. Create the backend Web Service in Render (Language=Docker,
#      Dockerfile Path=backend/Dockerfile, instance Type=Free).
#   2. Add all env vars from backend/.env.example in the Render dashboard.
#   3. Copy the service's Deploy Hook URL into the GitHub secret
#      RENDER_BACKEND_DEPLOY_HOOK.
#   4. Repeat for the frontend (static site, root=frontend/,
#      build=npm run build, publish=dist).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger backend deploy
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            --data '{"clearCache":"clear"}' \
            "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Trigger frontend deploy
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            --data '{"clearCache":"clear"}' \
            "$RENDER_FRONTEND_DEPLOY_HOOK"
