name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'deploy.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy.yml'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/granger-backend

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 }).ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: mongodb://localhost:27017/granger-test
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long-for-testing-purposes
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long-for-testing-purposes
      RESEND_API_KEY: re_test_dummy_key_for_testing_only
      RESEND_FROM_EMAIL: onboarding@resend.dev
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      CLOUDINARY_UPLOAD_PRESET: granger_avatars
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GITHUB_OAUTH_CLIENT_ID: test-github-client-id
      GITHUB_OAUTH_CLIENT_SECRET: test-github-client-secret
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --coverage
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  docker-build-push:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Only push the image when we land on main (PR builds only verify the
    # build, never publish).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  verify-build-on-pr:
    name: Verify Docker build (PR only)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: granger-backend:ci-pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke-test the image
        run: |
          docker run --rm -d \
            --name granger-smoke \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL=mongodb://invalid:27017/test \
            -e JWT_ACCESS_SECRET=ci-smoke-test-access-secret-at-least-32-chars \
            -e JWT_REFRESH_SECRET=ci-smoke-test-refresh-secret-at-least-32-chars \
            -e RESEND_API_KEY=re_dummy_key \
            -e RESEND_FROM_EMAIL=onboarding@resend.dev \
            -e CLOUDINARY_CLOUD_NAME=ci \
            -e CLOUDINARY_API_KEY=ci \
            -e CLOUDINARY_API_SECRET=ci \
            -e CLOUDINARY_UPLOAD_PRESET=granger_avatars \
            -e GOOGLE_CLIENT_ID=ci \
            -e GOOGLE_CLIENT_SECRET=ci \
            -e GITHUB_OAUTH_CLIENT_ID=ci \
            -e GITHUB_OAUTH_CLIENT_SECRET=ci \
            -e FRONTEND_URL=http://localhost:5173 \
            -e BACKEND_URL=http://localhost:4000 \
            granger-backend:ci-pr
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4000/health >/dev/null 2>&1; then
              echo "Health check OK"
              docker stop granger-smoke
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          docker logs granger-smoke
          docker stop granger-smoke || true
          exit 1
