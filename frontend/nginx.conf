server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets (1 year; Vite emits hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Source maps are never published; refuse them even if one slips in.
    location ~* \.map$ {
        return 404;
    }

    # Dynamic project routes share a prerendered, noindex app shell.
    location ~ ^/projects/[^/]+(/(edit|team))?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/index.html /app-shell.html;
    }

    # Every public route is prerendered at build time (dist/<route>/index.html);
    # anything else is a real 404 served with the custom 404 page, which also
    # boots the SPA.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
