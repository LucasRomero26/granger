<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Granger</title>
    <script>
      // Anti-flash + correct UA color-scheme for the active theme.
      // Default is `light` (matches the meta above). If the user's stored
      // preference or OS preference is dark, flip the meta to `dark` BEFORE
      // first paint so native form controls, scrollbars and autofill use the
      // right tints (declaring both `light dark` broke light-mode forms).
      (function () {
        try {
          var stored = localStorage.getItem('GRANGER_THEME');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.setAttribute('content', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
